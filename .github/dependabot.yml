version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns:
          - "ex_doc"
          - "credo"
          - "dialyxir"
        update-types: ["patch", "minor"]
      runtime-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ex_doc"
          - "credo"
          - "dialyxir"
        update-types: ["patch", "minor"]
    ignore:
      # jose 1.11.11+ uses the `dynamic()` type, which does not exist on the
      # OTP 25 CI target. Drop this once OTP 25 leaves the test matrix.
      - dependency-name: "jose"
        versions: [">= 1.11.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
